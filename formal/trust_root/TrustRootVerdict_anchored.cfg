\* The machine with no services named: the genesis is the out-of-band anchor, a head is current on
\* the holders' count, and Receipts are issued and do not count. Three versions with the one fork. Closes.
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
    Holders = {h1, h2, h3}
    NServices = 2
    Named = FALSE
    Faulty = 0
    Uncountable = FALSE
    Fork = TRUE
    Deep = TRUE
    MaxT = 2
    AttachWindow = 1
    Skew = 1
    MaxRevs = 2
    Plant = "none"
INVARIANTS
    TypeOK
    Inv_i
    Inv_ii
    Inv_iii
    Inv_v
    Inv_vi
    Inv_vii
    Inv_viii
    Inv_T7
    Inv_T4
    Inv_Stalled
    Inv_RecoverEnabled
    Inv_EndNoInstant
    Inv_PredecessorSet
    Inv_ForkNeverFreezes
    Inv_FreezeAdoptionOnly
    Inv_NoServicesNoReceipt
PROPERTIES
    Prop_ii
    Prop_iv
    Prop_vi
    Prop_T4
    Prop_PredecessorSet
    Prop_FreezeAdoptionOnly
