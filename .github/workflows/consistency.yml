name: consistency

# "Spec as executable infrastructure": every push/PR is gated on the evidence
# registry + dual-ID spine staying consistent with the prose. Hard errors: a dead
# in-repo pointer; a bad section address; a prose section missing from the dual-ID
# spine; a semantic-id that disagrees with its prose heading; a cross-repo pointer
# naming an artifact the pinned manifest does NOT publish; and a status its own
# evidence cannot support (`established` without a resolvable artifact, `normative`
# with one); and a dimension family documented in the prose that carries no registry
# row and no registered parent — CC 3.1.7 R2's "admits under an authority nobody chose",
# which was previously silent because the namespace generator harvests only CC 3.1.x.
# The known unowned set is PINNED: a new orphan fails, and so does a pin that outlives
# its gap.
#
# A cross-repo pointer whose pinned manifest simply does not reach that section yet
# still warns rather than fails — pending is not dead.
#
# Coverage is reported as sections backed by RESOLVABLE evidence, never as sections
# that merely carry a row. Those are different numbers and the gap is the point.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  claims-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence registry + toc/prose drift + normative coverage + ticket-state and pin gates
        env:
          GH_TOKEN: ${{ github.token }}   # the ticket-state gates query issue state; unauthenticated gh only NOTEs
        run: python3 tools/check_claims.py
      - name: Relative links resolve (no dangling paths)
        run: python3 tools/check_links.py
      - name: The Parts carry no stale reference, pointer, history, label, comparison or dated fact
        run: python3 tools/check_stale_refs.py
      - name: Namespace registry and match vectors are regenerated (no drift)
        run: |
          python3 tools/build_cc_namespace.py
          python3 tools/cc_namespace_match.py --self-test
          python3 tools/cc_namespace_match.py --write-vectors
          git diff --exit-code manifests/
      - name: Signed object (CC 2.6.1.7) is regenerated from its table and its vectors recompute
        run: |
          python3 tools/build_cc_signed_object.py
          python3 tools/build_cc_signed_object.py --self-test
          git diff --exit-code manifests/ constitution/part_2_the_grammar.md
      - name: Governance policy table (CC 4.5.13) is in the corridor, regenerated, and its vectors recompute (no drift)
        run: |
          python3 tools/build_governance_policy.py
          python3 tools/build_governance_policy.py --self-test
          git diff --exit-code manifests/governance_policy.json manifests/governance_policy_vectors.json formal/two_path/generated/
      - name: CSD/4 chain manifest (models → state table → atoms → claims → evidence → catalogue) is regenerated (no drift)
        run: |
          pip install -q pyyaml
          python3 tools/build_csd4_chain.py
          git diff --exit-code manifests/csd4_chain.json
      - name: Closure configurations are regenerated from the vendored catalogue (no drift)
        run: |
          pip install -q pyyaml
          python3 tools/topology_to_cfg.py --all
          git diff --exit-code formal/cewp_node/generated/
      - name: "Catalogue coverage of the formally defined states (reported, not gated)"
        run: python3 tools/catalogue_coverage.py
      - name: Formal state table, invariant table and atom vocabulary agree with the models, the toc and the register
        run: python3 tools/check_formal_tables.py
      - name: Signed-object CDDL parses and admits every admit vector (generated and draft-wrapped forms)
        run: |
          sudo gem install -q cddl
          python3 tools/build_ietf_draft.py --check
      - name: Counts the formal prose quotes (states, properties, atoms, catalogue) equal the tables and the chain
        run: |
          pip install -q pyyaml
          python3 tools/check_formal_counts.py
      - name: Volume map (toc.tsv volume column) is regenerated from constitution/volumes.tsv
        run: |
          python3 build_pdf.py --write-toc-volumes
          git diff --exit-code constitution/toc.tsv
