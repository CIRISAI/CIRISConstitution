name: consistency

# "Spec as executable infrastructure": every push/PR is gated on the evidence
# registry + dual-ID spine staying consistent with the prose. Hard errors: a dead
# in-repo pointer; a bad section address; a prose section missing from the dual-ID
# spine; a semantic-id that disagrees with its prose heading; a cross-repo pointer
# naming an artifact the pinned manifest does NOT publish; and a status its own
# evidence cannot support (`established` without a resolvable artifact, `normative`
# with one); and a dimension family documented in the prose that carries no registry
# row and no registered parent — CC 3.1.7 R2's "admits under an authority nobody chose",
# which was previously silent because the namespace generator harvests only CC 3.1.x.
# The known unowned set is PINNED: a new orphan fails, and so does a pin that outlives
# its gap.
#
# A cross-repo pointer whose pinned manifest simply does not reach that section yet
# still warns rather than fails — pending is not dead.
#
# Coverage is reported as sections backed by RESOLVABLE evidence, never as sections
# that merely carry a row. Those are different numbers and the gap is the point.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  claims-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence registry + toc/prose drift + normative coverage + ticket-state and pin gates
        env:
          GH_TOKEN: ${{ github.token }}   # the #65/#63 gates query issue state; unauthenticated gh only NOTEs
        run: python3 tools/check_claims.py
      - name: Namespace registry and match vectors are regenerated (no drift)
        run: |
          python3 tools/build_cc_namespace.py
          python3 tools/cc_namespace_match.py --self-test
          python3 tools/cc_namespace_match.py --write-vectors
          git diff --exit-code manifests/
