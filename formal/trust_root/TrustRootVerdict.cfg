\* The machine with services named: three holders, three named services of which one may issue for
\* two bundles at one version, two versions with the one fork. Closes.
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
    Holders = {h1, h2, h3}
    NServices = 3
    Named = TRUE
    Faulty = 1
    Uncountable = FALSE
    Fork = TRUE
    Deep = FALSE
    MaxT = 2
    AttachWindow = 1
    Skew = 1
    MaxRevs = 2
    Plant = "none"
INVARIANTS
    TypeOK
    Inv_i
    Inv_ii
    Inv_iii
    Inv_v
    Inv_vi
    Inv_vii
    Inv_viii
    Inv_FirstBundleStands
    Inv_T7
    Inv_T4
    Inv_Stalled
    Inv_RecoverEnabled
    Inv_EndNoInstant
    Inv_PredecessorSet
    Inv_ForkNeverFreezes
    Inv_FreezeAdoptionOnly
    Inv_NoServicesNoReceipt
PROPERTIES
    Prop_ii
    Prop_iv
    Prop_vi
    Prop_T4
    Prop_PredecessorSet
    Prop_FreezeAdoptionOnly
