name: formal

# The checked-in configuration closes (22,152,480 distinct states, depth 25, ~9 min on
# 8 workers); allow up to two hours on a small runner. State files go to a temp dir.
on:
  workflow_dispatch:
  push:
    paths:
      - 'formal/**'
      - 'constitution/part_3_the_namespace.md'
      - '.github/workflows/formal.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'constitution/part_3_the_namespace.md'
      - '.github/workflows/formal.yml'

jobs:
  tlc:
    name: TLC — CC 3.2 T8 standing verdict
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch tla2tools (pinned release)
        run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Model-check TrustRootVerdict
        working-directory: formal/trust_root
        run: java -XX:+UseParallelGC -Xmx5g -cp ../../tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/tlc" -deadlock TrustRootVerdict.tla

  mesh:
    name: TLC — the mesh net invariants (formal/mesh_net)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch tla2tools (pinned release)
        run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: RootReach closes
        working-directory: formal/mesh_net
        run: java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/tlc-rr" -deadlock -config RootReach.cfg RootReach.tla
      - name: The ruled configuration closes (#141)
        working-directory: formal/mesh_net
        run: java -XX:+UseParallelGC -Xmx6g -cp ../../tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/tlc-ruled" -deadlock -config MeshNet_ruled.cfg MeshNet.tla
      - name: The shipped configurations each fail their one invariant (the defects #141 corrects)
        working-directory: formal/mesh_net
        run: |
          set +e
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers 2 -metadir "$RUNNER_TEMP/tlc-s1" -deadlock -config MeshNet_shipped_scope.cfg MeshNet.tla | tee s1.log
          grep -q 'Invariant Inv_Invisible is violated' s1.log || exit 1
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers 2 -metadir "$RUNNER_TEMP/tlc-s2" -deadlock -config MeshNet_shipped_bind.cfg MeshNet.tla | tee s2.log
          grep -q 'Invariant Inv_ClaimNotBinding is violated' s2.log || exit 1

  halt:
    name: TLC — the halt's fire path (formal/accord_halt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: The one-row path and the fuse close; the proposal path shows its window and stuck state
        working-directory: formal/accord_halt
        run: |
          set +e
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/h1" -deadlock -config AccordHalt_row.cfg AccordHalt.tla || exit 1
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/h2" -deadlock -config AccordHaltFuse.cfg AccordHaltFuse.tla || exit 1
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers 2 -metadir "$RUNNER_TEMP/h3" -deadlock -config AccordHalt_proposal_window.cfg AccordHalt.tla | tee w.log
          grep -q 'Invariant Inv_NoWindow is violated' w.log || exit 1
          java -Xmx2g -cp ../../tla2tools.jar tlc2.TLC -workers 2 -metadir "$RUNNER_TEMP/h4" -deadlock -config AccordHalt_proposal_stuck.cfg AccordHalt.tla | tee s.log
          grep -q 'Invariant NotStuck is violated' s.log || exit 1
