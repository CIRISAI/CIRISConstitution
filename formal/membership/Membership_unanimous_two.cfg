\* Unanimous removal read as every other member. In a family at two members either removes the other; in a community
\* the floor of two voices (CC 4.5.13) refuses that removal, so this twin holds: Inv_CoercedCannotRemoveHonest is kept.
SPECIFICATION Spec
CONSTANTS k1 = k1 k2 = k2 k3 = k3 k4 = k4
  Keys = {k1, k2, k3, k4}
  Listed = {k1, k2, k3}
  Founders = {k1, k2, k3}
  Protocol = "unanimous"
  M = 1
  Roles = {"member", "none"}
  Offered = "member"
  Window = 2
  HoldWindow = 1
  MaxGen = 2
  Coercible = {k3, k4}
  Binding = "spent"
  RemovalRule = "protocol"
  FounderBasis = "active"
  FoundingRule = "signed"
  HoldExpiry = TRUE
  GroupKind = "community"
  UnanimousRemoval = "others"
  MaxProposals = 2
  MaxChanges = 2
INVARIANTS TypeOK Inv_ExpiryBound Inv_JoinerConsented Inv_ResignationEnabled
PROPERTIES Inv_AcceptanceBindsOneProposal Inv_DeclineTerminal Inv_NoSelfAdmission
  Inv_QuorumGovernsRoster Inv_CoercedCannotRemoveHonest Inv_LeavingNotUndone
  Prop_HeldChangeResolves
