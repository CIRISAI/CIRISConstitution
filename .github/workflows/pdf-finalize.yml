name: pdf-finalize
# On merge to main, collapse the pre-release PDF name (ciris_constitution-<V>.<n>.pdf)
# to the bare version (ciris_constitution-<V>.pdf), keep it there, and refresh the
# permalink CIRISConstitution-latest.pdf as a byte copy of it. Earlier releases
# (-rc3.pdf, -rc4.pdf, ...) are never removed: published links must keep resolving.
# Loop-safe: commits only when the CURRENT version's filename set is wrong (a numbered
# build present, the clean name absent, or the permalink absent) — never on byte
# differences, so the finalize commit itself triggers a run that finds nothing to do.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check filename state
        id: state
        run: |
          V=$(cat VERSION)
          NUMBERED=$(ls ciris_constitution-${V}.[0-9]*.pdf 2>/dev/null || true)
          if [ -n "$NUMBERED" ] || [ ! -f "ciris_constitution-${V}.pdf" ] || [ ! -f "CIRISConstitution-latest.pdf" ]; then
            echo "finalize=yes" >> "$GITHUB_OUTPUT"
          else
            echo "finalize=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Install TeX Live
        if: steps.state.outputs.finalize == 'yes'
        run: sudo apt-get update -q && sudo apt-get install -y -q texlive-latex-extra texlive-fonts-recommended
      - name: Rebuild as the release name
        if: steps.state.outputs.finalize == 'yes'
        run: PDF_BRANCH=main python3 build_pdf.py
      - name: Commit the finalized PDF and refresh the permalink
        if: steps.state.outputs.finalize == 'yes'
        run: |
          V=$(cat VERSION)
          cp "ciris_constitution-${V}.pdf" CIRISConstitution-latest.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "ciris_constitution-${V}.pdf" CIRISConstitution-latest.pdf
          git rm -q --cached ciris_constitution-${V}.[0-9]*.pdf 2>/dev/null || true
          rm -f ciris_constitution-${V}.[0-9]*.pdf
          git commit -m "PDF: finalize ${V} on main (permalink refreshed; earlier releases retained)" && git push
