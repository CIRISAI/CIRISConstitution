\* Planted fault: a fork attempt, a counted head that is not receipted, freezes the lineage.
\* Must fail Inv_ForkNeverFreezes.
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
    Holders = {h1, h2, h3}
    NServices = 3
    Named = TRUE
    Faulty = 1
    Uncountable = FALSE
    Fork = TRUE
    Deep = FALSE
    MaxT = 2
    AttachWindow = 1
    Skew = 1
    MaxRevs = 2
    Plant = "fork_freezes"
INVARIANTS
    Inv_ForkNeverFreezes
