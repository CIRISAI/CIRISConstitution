\* Planted fault: a bound on a holder's key unmakes the first bundle, so one holder's key revoked
\* with no bound leaves no bundle of the lineage verifying. Must fail Inv_FirstBundleStands.
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
    Holders = {h1, h2, h3}
    NServices = 3
    Named = TRUE
    Faulty = 1
    Uncountable = FALSE
    Fork = TRUE
    Deep = FALSE
    MaxT = 2
    AttachWindow = 1
    Skew = 1
    MaxRevs = 2
    Plant = "bound_unmakes_first"
INVARIANTS
    Inv_FirstBundleStands
